# nginx front-end for SideBooster — use when nginx already serves other sites on this server.
# Install:  cp deploy/nginx-sidebooster.conf /etc/nginx/sites-available/sidebooster.com
#           ln -s /etc/nginx/sites-available/sidebooster.com /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
#           certbot --nginx -d sidebooster.com -d www.sidebooster.com     (adds the HTTPS server block)
# The app listens on 127.0.0.1:${APP_HOST_PORT} (3001 on this server — see .env.production).

server {
    listen 80;
    listen [::]:80;
    server_name sidebooster.com www.sidebooster.com;

    client_max_body_size 120m;   # listing photos + video

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
