# Local development:   docker compose up -d db            (PostgreSQL only; run the app with `npm run dev`)
# Server (VPS, e.g. Hostinger KVM):
#   cp .env.production.example .env.production   # fill it in
#   docker compose --env-file .env.production --profile app up -d --build
# This starts PostgreSQL, the app, the 5-minute cron caller and Caddy (automatic HTTPS for $DOMAIN).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sidebooster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidebooster}
      POSTGRES_DB: ${POSTGRES_DB:-sidebooster}
    ports:
      # host port only for local tools; set DB_HOST_PORT if 5432 is taken (e.g. a preinstalled PostgreSQL on the VPS)
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sidebooster}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sidebooster}:${POSTGRES_PASSWORD:-sidebooster}@db:5432/${POSTGRES_DB:-sidebooster}
    depends_on:
      db:
        condition: service_healthy
    # only reachable from this server; the public reaches it through Caddy (HTTPS)
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - appdata:/data

  # Calls the scheduled worker every 5 minutes (closes ticket sales, expires checkouts, reminders…).
  cron:
    profiles: ["app"]
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: .env.production
    depends_on: [app]
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 300; curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/tick || true; echo; done"]

  # HTTPS reverse proxy. Gets and renews Let's Encrypt certificates for $DOMAIN and www.$DOMAIN automatically.
  caddy:
    profiles: ["app"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [app]

volumes:
  pgdata:
  appdata:
  caddydata:
  caddyconfig:
